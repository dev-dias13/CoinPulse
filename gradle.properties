# --- JVM ---
# Heap для демона Gradle. 4 ГБ хватает проекту такого размера;
# завышать вредно: демон и Kotlin-демон делят физическую память,
# при переподписке система уходит в своп и билд замедляется.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# --- Производительность сборки ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- AGP 9: временный отказ от новых дефолтов ---
# AGP 9 включает built-in Kotlin: плагин org.jetbrains.kotlin.android больше
# не нужен и при явном применении падает с ошибкой про дублирующееся
# расширение 'kotlin'. Convention-плагины проекта пока применяют KGP явно,
# что даёт контроль над версией Kotlin через libs.versions.toml
# (built-in Kotlin приносит свою, привязанную к версии AGP).
android.builtInKotlin=false

# Следствие предыдущего флага: старый KGP несовместим с новым DSL AGP 9.
android.newDsl=false

# Оба флага удалены в AGP 10 — миграция на built-in Kotlin обязательна до апгрейда.
# Задача: перевести convention-плагины, убрать оба флага.

kotlin.code.style=official